    <style>
      #boot-screen { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center;

      .boot-text { margin: 0; font-size: 13px; letter-spacing: .04em; }
      @media (prefers-reduced-motion: no-preference) { .boot-logo { animation: boot-pulse 1.4s ease-in-out infinite; } }
      @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    </style>
