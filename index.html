<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#071426" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SD Veresiye" />
    <meta name="description" content="Ferhat Büfe müşterileri için güvenli veresiye hesap takibi." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta property="og:title" content="SD Veresiye" />
    <meta property="og:description" content="Ferhat Büfe müşteri veresiye hesap takibi." />
    <meta property="og:image" content="/silopi-dijital-logo.png" />
    <meta name="twitter:card" content="summary" />
    <title>SD Veresiye · Ferhat Büfe</title>

    <!-- Logo, ilk boyamada hazır olsun diye önceden yükleniyor. -->
    <link rel="preload" as="image" href="/silopi-dijital-logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/icon-192.png" />

    <!-- Yazı tipleri: render'ı engellemeden yüklenir (media=print hilesi), hazır olunca uygulanır. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
    />
    <style>
      /* Yazı tipleri yalnızca kullanıldığı yerde yüklenir (render engellemesi yok). */
      :root { color-scheme: dark; }
      html { background: #071426; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      /* Açılış ekranı: JS yüklenirken sadece logo görünür, yazı yok. */
      #boot-screen {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
        background: #071426;
      }
      #boot-screen img { width: 132px; height: auto; }
      @media (prefers-reduced-motion: no-preference) {
        #boot-screen img { animation: boot-fade 1.1s ease-in-out infinite; }
      }
      @keyframes boot-fade { 0%, 100% { opacity: 1; } 50% { opacity: .62; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen" aria-hidden="true">
        <img src="/silopi-dijital-logo.png" alt="" width="132" height="38" fetchpriority="high" decoding="async" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
